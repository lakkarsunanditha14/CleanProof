# Builds the CleanProof container (Dockerfile) and publishes it to GitHub Container Registry.
# Azure App Service runs this image, so every push to main updates the cloud app.
name: Build cloud image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lakkarsunanditha14/cleanproof:latest
